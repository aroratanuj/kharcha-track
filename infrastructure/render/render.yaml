services:
  - type: web
    name: kts-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: GMAIL_WEBHOOK_SECRET
        generateValue: true
